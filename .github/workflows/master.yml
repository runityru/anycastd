---
name: Master

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.19.0

      # `make build` produces the unified dist/ artifact via goreleaser
      # (snapshot mode is the default).
      - name: Build dist artifact
        run: make build

      - name: Generate image tags
        id: meta
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHORTCOMMIT=$(git rev-parse --short HEAD)
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:master-${SHORTCOMMIT} ${IMAGE}:master-${TIMESTAMP} ${IMAGE}:master-${SHORTCOMMIT}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `make container-image push=true` builds the multi-arch image from the
      # dist/ artifact produced by `make build` and pushes it.
      - name: Build and push Docker image
        run: make container-image push=true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
