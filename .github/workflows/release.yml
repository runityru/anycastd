---
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: articulate/actions-markdownlint@v1

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
      - name: Install dependencies
        run: go mod download
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      # Gating static-analysis: golangci-lint + go-arch-lint only. Security
      # linters (gosec, govulncheck) are surfaced separately in the
      # non-gating `security` job so they never block the build.
      - name: Lint (golangci + arch)
        run: make lint-golangci arch

  # Security linters are surfaced as a separate, NON-GATING job so they never
  # hard-block the release (continue-on-error: true).
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Gosec (Go security scanner)
        run: make lint-gosec
      - name: Govulncheck (Go vulnerability scanner)
        run: make lint-vuln

  unittests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Test with the Go CLI
        run: make test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    needs:
      - hadolint
      - markdownlint
      - lint
      - unittests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Setup GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.19.0
      # `make build SNAPSHOT=false` produces a real goreleaser release (which
      # also publishes the GitHub release).
      - name: Build release artifact
        run: make build SNAPSHOT=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker tags
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHORTCOMMIT=$(git rev-parse --short HEAD)
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest ${IMAGE}:${VERSION} ${IMAGE}:${VERSION}-${TIMESTAMP} ${IMAGE}:${VERSION}-${SHORTCOMMIT} ${IMAGE}:${VERSION}-${SHORTCOMMIT}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push multi-arch Docker image
        run: make container-image push=true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
