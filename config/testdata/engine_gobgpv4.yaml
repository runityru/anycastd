---
announcer:
  engine: gobgpv4
  router_id: 10.3.3.3
  local_address: 10.0.0.1
  local_asn: 65999
  routes:
    - 10.0.0.128/32
  peers:
    - name: some_router_1
      remote_address: 10.0.0.252
      remote_asn: 65000
services:
  - name: http
    check_interval: 10s
    checks:
      - kind: dns_lookup
        spec:
          query: example.com
          resolver: 127.0.0.1
          tries: 3
          interval: 100ms
metrics:
  enabled: true
  address: 127.0.0.1:9090
