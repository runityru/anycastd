---
announcer:
  router_id: 10.3.3.3
  local_asn: 65999
  routes:
    - 2001:db8:1::/48
  peers:
    - name: some_router_1
      remote_address: fe80::1
      remote_asn: 65000
      enable_multihop: true
      multihop_ttl: 2
    - name: some_router_2
      remote_address: 2001:db8::252%eth0
      remote_asn: 65000
services:
  - name: http
    check_interval: 10s
    checks:
      - kind: dns_lookup
        spec: {}
metrics:
  enabled: true
  address: address
